[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "regionstats"
version = "0.1.0"
description = "Group A Project 3 – Region statistics tool"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Group A", email = "alzaraim.de@gmail.com" }
]

dependencies = [
    "pyfaidx",
    "pyranges",
    "pandas"
]


[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
    "mypy"
]
