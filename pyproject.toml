[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regionstats"
version = "0.1.0"
description = "Group A Project 3 – Region statistics tool"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Group A" }
]

dependencies = [
    "pyfaidx",
    "pyranges",
    "pandas",
    "biopython"
]

[project.optional-dependencies]
bigwig = ["pyBigWig"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0"
]

[project.scripts]
regionstats = "regionstats.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/regionstats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
